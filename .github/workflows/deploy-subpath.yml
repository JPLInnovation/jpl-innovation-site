name: Deploy to GitHub Pages (sub-address)

# For a copy of the site in a project repository (such as jpl-innovation/jpl_site2), which GitHub Pages serves under
# /<repository>/ instead of at the root. The site is built as usual and scripts/prefix-paths.mjs then puts the
# repository's name in front of its links and files. The organisation's own site (jpl-innovation.github.io) is
# deployed by deploy.yml and is not touched by this.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: ${{ !endsWith(github.repository, '.github.io') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/prefix-paths.mjs dist "/${{ github.event.repository.name }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
